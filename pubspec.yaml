name: iptv_app
description: Una aplicación IPTV en Flutter.

publish_to: 'none' # Evita publicar accidentalmente la app en pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  better_player_plus: ^1.4.1
  cast: ^2.1.0
  http: ^1.3.0
  path_provider: ^2.0.2

  # Otras dependencias opcionales
  provider: ^6.0.0  # Gestión de estado
  shared_preferences: ^2.0.5  # Guardar configuraciones locales
  connectivity_plus: ^6.1.3  # Verificar conexión a internet
  flutter_local_notifications: ^18.0.1  # Notificaciones locales

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
